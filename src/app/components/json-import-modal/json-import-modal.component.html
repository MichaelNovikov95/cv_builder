<div
  *ngIf="isOpen()"
  class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 p-4"
  (click)="close()"
>
  <div
    class="bg-white rounded-lg shadow-xl max-w-2xl w-full max-h-[90vh] overflow-hidden flex flex-col"
    (click)="$event.stopPropagation()"
  >
    <div class="p-4 border-b">
      <h2 class="text-xl font-semibold">Import JSON</h2>
    </div>
    <div class="p-4 flex-1 overflow-y-auto">
          <textarea
            [(ngModel)]="jsonInput"
            placeholder="Paste your JSON data here..."
            class="w-full h-64 p-3 border border-gray-300 rounded font-mono text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"
          ></textarea>
      <div *ngIf="error()" class="mt-2 p-2 bg-red-100 text-red-700 rounded text-sm">
        {{ error() }}
      </div>
    </div>
    <div class="p-4 border-t flex justify-end gap-2">
      <button
        type="button"
        (click)="close()"
        class="px-4 py-2 bg-gray-200 hover:bg-gray-300 rounded"
      >
        Cancel
      </button>
      <button
        type="button"
        (click)="handleImport()"
        [disabled]="!jsonInput.trim()"
        class="px-4 py-2 bg-blue-600 text-white hover:bg-blue-700 disabled:opacity-50 disabled:cursor-not-allowed rounded"
      >
        Import
      </button>
    </div>
  </div>
</div>
