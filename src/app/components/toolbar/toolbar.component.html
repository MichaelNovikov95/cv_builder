<div class="bg-white border-b border-gray-200 shadow-sm">
  <div class="max-w-7xl mx-auto px-4 py-3">
    <div class="flex flex-wrap items-center justify-between gap-4">
      <div class="flex items-center gap-4">
        <h1 class="text-xl font-bold text-gray-900">{{ i18n.t('toolbar.title') }}</h1>
        <div class="flex items-center gap-2">
          <button
          type="button"
          (click)="theme.toggle()"
          class="px-3 py-1.5 bg-gray-100 hover:bg-gray-200 rounded text-sm"
        >
          {{ theme.isDark() ? i18n.t('theme.lightMode') : i18n.t('theme.darkMode') }}
        </button>
        <button
          type="button"
          (click)="toggleLocale()"
          class="px-3 py-1.5 bg-gray-100 hover:bg-gray-200 rounded text-sm"
        >
          {{ i18n.localeToggleButtonLabel() }}
        </button>
        </div>
      </div>

      <div class="flex flex-wrap items-center gap-2">
        <button
          type="button"
          (click)="loadDemo()"
          class="px-3 py-1.5 bg-gray-100 hover:bg-gray-200 rounded text-sm"
        >
          {{ i18n.t('toolbar.loadDemo') }}
        </button>
        <button
          type="button"
          (click)="clearData()"
          class="px-3 py-1.5 bg-red-100 text-red-700 hover:bg-red-200 rounded text-sm"
        >
          {{ i18n.t('toolbar.clearData') }}
        </button>
        <button
          type="button"
          (click)="exportJson()"
          class="px-3 py-1.5 bg-blue-600 text-white hover:bg-blue-700 rounded text-sm"
        >
          {{ i18n.t('toolbar.exportJson') }}
        </button>
        <button
          type="button"
          (click)="openImportModal()"
          class="px-3 py-1.5 bg-green-600 text-white hover:bg-green-700 rounded text-sm"
        >
          {{ i18n.t('toolbar.importJson') }}
        </button>
        <button
          type="button"
          (click)="goToPreview()"
          class="px-3 py-1.5 bg-purple-600 text-white hover:bg-purple-700 rounded text-sm"
        >
          {{ i18n.t('toolbar.printPdf') }}
        </button>
      </div>
    </div>

    <div *ngIf="store.ui().error" class="mt-2 p-2 bg-red-100 text-red-700 rounded text-sm">
      {{ store.ui().error }}
      <button
        type="button"
        (click)="store.clearError()"
        class="ml-2 underline"
      >
        {{ i18n.t('toolbar.dismiss') }}
      </button>
    </div>
  </div>
</div>

<app-json-import-modal
  #importModal
  (import)="handleImport($event)"
></app-json-import-modal>
