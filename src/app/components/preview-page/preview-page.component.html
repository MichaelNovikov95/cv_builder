<div class="app-page print:bg-white">
  <!-- Toolbar (hidden in print) -->
  <div class="app-toolbar print:hidden">
    <div class="app-toolbar-inner">
      <h1 class="app-toolbar-title">{{ i18n.t('preview.toolbarTitle') }}</h1>
      <div class="app-toolbar-actions">
        <button
          type="button"
          (click)="toggleTheme()"
          class="app-btn app-btn-secondary"
        >
          {{ theme.isDark() ? i18n.t('theme.lightMode') : i18n.t('theme.darkMode') }}
        </button>
        <button
          type="button"
          (click)="toggleLocale()"
          class="app-btn app-btn-secondary"
        >
          {{ i18n.localeToggleButtonLabel() }}
        </button>
        <button
          type="button"
          (click)="goBack()"
          class="app-btn app-btn-secondary"
        >
          {{ i18n.t('preview.backToEditor') }}
        </button>
        <button
          type="button"
          (click)="print()"
          class="app-btn app-btn-primary"
        >
          {{ i18n.t('preview.printSavePdf') }}
        </button>
      </div>
    </div>
  </div>

  <!-- CV Content -->
  <div>
    <div class="cv-root cv-shell" >
      <app-cv-template-classic
        *ngIf="store.template() === 'classic'"
      ></app-cv-template-classic>
      <app-cv-template-twocolumn
        *ngIf="store.template() === 'twocol'"
      ></app-cv-template-twocolumn>
    </div>
  </div>
</div>
