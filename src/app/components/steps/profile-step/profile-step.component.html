<div class="space-y-4" [formGroup]="form">
  <h2 class="text-2xl font-semibold mb-4">Profile Information</h2>

  <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
    <div class="md:col-span-2">
      <label class="block text-sm font-medium text-gray-700 mb-1">
        Full Name <span class="text-red-500">*</span>
      </label>
      <input
        type="text"
        formControlName="name"
        class="w-full px-3 py-2 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-blue-500"
      />
      <div
        *ngIf="form.get('name')?.invalid && form.get('name')?.touched"
        class="mt-1 text-sm text-red-600"
      >
        Name is required
      </div>
    </div>

    <div class="md:col-span-2">
      <label class="block text-sm font-medium text-gray-700 mb-1">
        Professional Title <span class="text-red-500">*</span>
      </label>
      <input
        type="text"
        formControlName="title"
        placeholder="e.g., Senior Software Engineer"
        class="w-full px-3 py-2 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-blue-500"
      />
      <div
        *ngIf="form.get('title')?.invalid && form.get('title')?.touched"
        class="mt-1 text-sm text-red-600"
      >
        Title is required
      </div>
    </div>

    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">
        Email <span class="text-red-500">*</span>
      </label>
      <input
        type="email"
        formControlName="email"
        class="w-full px-3 py-2 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-blue-500"
      />
      <div
        *ngIf="form.get('email')?.invalid && form.get('email')?.touched"
        class="mt-1 text-sm text-red-600"
      >
        Valid email is required
      </div>
    </div>

    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">Phone</label>
      <input
        type="tel"
        formControlName="phone"
        class="w-full px-3 py-2 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-blue-500"
      />
    </div>

    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">Location</label>
      <input
        type="text"
        formControlName="location"
        placeholder="e.g., San Francisco, CA"
        class="w-full px-3 py-2 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-blue-500"
      />
    </div>

    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">Photo URL</label>
      <input
        type="url"
        formControlName="photoUrl"
        placeholder="https://..."
        class="w-full px-3 py-2 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-blue-500"
      />
    </div>

    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">Website</label>
      <input
        type="url"
        formControlName="website"
        placeholder="https://..."
        class="w-full px-3 py-2 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-blue-500"
      />
    </div>

    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">LinkedIn</label>
      <input
        type="text"
        formControlName="linkedin"
        placeholder="linkedin.com/in/username"
        class="w-full px-3 py-2 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-blue-500"
      />
    </div>

    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">GitHub</label>
      <input
        type="text"
        formControlName="github"
        placeholder="github.com/username"
        class="w-full px-3 py-2 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-blue-500"
      />
    </div>
  </div>

  <div>
    <label class="block text-sm font-medium text-gray-700 mb-1">
      Professional Summary <span class="text-red-500">*</span>
    </label>
    <textarea
      formControlName="summary"
      rows="5"
      placeholder="Write a brief summary of your professional background..."
      class="w-full px-3 py-2 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-blue-500"
    ></textarea>
    <div
      *ngIf="form.get('summary')?.invalid && form.get('summary')?.touched"
      class="mt-1 text-sm text-red-600"
    >
      Summary is required
    </div>
  </div>
</div>
