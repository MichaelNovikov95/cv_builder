<div class="space-y-4">
  <div class="flex items-center justify-between mb-4">
    <h2 class="text-2xl font-semibold">{{ i18n.t('form.languages.sectionTitle') }}</h2>
    <button
      type="button"
      (click)="addLanguage()"
      class="px-4 py-2 bg-blue-600 text-white hover:bg-blue-700 rounded text-sm"
    >
      {{ i18n.t('form.languages.addButton') }}
    </button>
  </div>

  <div *ngIf="languagesArray.length === 0" class="text-gray-500 text-center py-8">
    {{ i18n.t('form.languages.empty') }}
  </div>

  <div
    *ngFor="let lang of languagesArray.controls; let i = index"
    class="border border-gray-200 rounded-lg p-4"
  >
    <div class="flex items-start justify-between">
      <div class="flex-1 grid grid-cols-1 md:grid-cols-2 gap-4">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">
            {{ i18n.t('form.languages.languageLabel') }} <span class="text-red-500">*</span>
          </label>
          <input
            type="text"
            [formControl]="$any(lang.get('language'))!"
            [placeholder]="i18n.t('form.languages.languagePlaceholder')"
            class="w-full px-3 py-2 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-blue-500"
          />
          <div *ngIf="showControlError($any(lang.get('language')), 'required')" class="mt-1 text-sm text-red-600">
            {{ i18n.t('form.languages.languageRequired') }}
          </div>
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">
            {{ i18n.t('form.languages.levelLabel') }} <span class="text-red-500">*</span>
          </label>
          <select
            [formControl]="$any(lang.get('level'))!"
            class="w-full px-3 py-2 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-blue-500"
          >
            <option value="">{{ i18n.t('form.languages.levelSelect') }}</option>
            <option value="Native">{{ i18n.t('form.languages.level.native') }}</option>
            <option value="Fluent">{{ i18n.t('form.languages.level.fluent') }}</option>
            <option value="Advanced">{{ i18n.t('form.languages.level.advanced') }}</option>
            <option value="Intermediate">{{ i18n.t('form.languages.level.intermediate') }}</option>
            <option value="Basic">{{ i18n.t('form.languages.level.basic') }}</option>
          </select>
          <div *ngIf="showControlError($any(lang.get('level')), 'required')" class="mt-1 text-sm text-red-600">
            {{ i18n.t('form.languages.levelRequired') }}
          </div>
        </div>
      </div>
      <button
        type="button"
        (click)="removeLanguage(i)"
        class="ml-4 px-3 py-1 bg-red-100 text-red-700 hover:bg-red-200 rounded text-sm"
      >
        {{ i18n.t('common.remove') }}
      </button>
    </div>
  </div>
</div>
