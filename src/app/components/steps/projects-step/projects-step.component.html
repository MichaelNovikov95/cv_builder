<div class="space-y-4">
  <div class="flex items-center justify-between mb-4">
    <h2 class="text-2xl font-semibold">Projects</h2>
    <button
      type="button"
      (click)="addProject()"
      class="px-4 py-2 bg-blue-600 text-white hover:bg-blue-700 rounded text-sm"
    >
      + Add Project
    </button>
  </div>

  <div *ngIf="projectsArray.length === 0" class="text-gray-500 text-center py-8">
    No projects yet. Click "Add Project" to get started.
  </div>

  <div
    *ngFor="let project of projectsArray.controls; let i = index"
    class="border border-gray-200 rounded-lg p-4 space-y-4"
  >
    <div class="flex items-start justify-between">
      <h3 class="text-lg font-semibold">Project #{{ i + 1 }}</h3>
      <div class="flex items-center gap-2">
        <app-reorder-buttons
          [canMoveUp]="i > 0"
          [canMoveDown]="i < projectsArray.length - 1"
          (moveUp)="moveUp(i)"
          (moveDown)="moveDown(i)"
        ></app-reorder-buttons>
        <button
          type="button"
          (click)="removeProject(i)"
          class="px-3 py-1 bg-red-100 text-red-700 hover:bg-red-200 rounded text-sm"
        >
          Remove
        </button>
      </div>
    </div>

    <div [formGroup]="$any(project)" class="space-y-4">
      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">
            Project Name <span class="text-red-500">*</span>
          </label>
          <input
            type="text"
            formControlName="name"
            class="w-full px-3 py-2 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-blue-500"
          />
        </div>
        <div class="md:col-span-2">
          <label class="block text-sm font-medium text-gray-700 mb-1">
            Description <span class="text-red-500">*</span>
          </label>
          <textarea
            formControlName="description"
            rows="2"
            class="w-full px-3 py-2 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-blue-500"
          ></textarea>
        </div>
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700 mb-2">Tech Stack</label>
        <div formArrayName="stack" class="space-y-2">
          <div
            *ngFor="let tag of getStack($any(project)).controls; let j = index"
            class="flex gap-2"
          >
            <input
              type="text"
              [formControl]="$any(tag)"
              placeholder="Enter technology..."
              class="flex-1 px-3 py-2 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-blue-500"
            />
            <button
              type="button"
              (click)="removeStackItem($any(project), j)"
              class="px-3 py-2 bg-gray-100 hover:bg-gray-200 rounded text-sm"
            >
              Remove
            </button>
          </div>
          <button
            type="button"
            (click)="addStackItem($any(project))"
            class="px-3 py-1.5 bg-gray-100 hover:bg-gray-200 rounded text-sm"
          >
            + Add Technology
          </button>
        </div>
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700 mb-2">Links</label>
        <div formGroupName="links" class="grid grid-cols-1 md:grid-cols-3 gap-4">
          <div>
            <label class="block text-xs text-gray-600 mb-1">Live URL</label>
            <input
              type="url"
              formControlName="live"
              placeholder="https://..."
              class="w-full px-3 py-2 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-blue-500"
            />
          </div>
          <div>
            <label class="block text-xs text-gray-600 mb-1">GitHub</label>
            <input
              type="url"
              formControlName="github"
              placeholder="https://..."
              class="w-full px-3 py-2 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-blue-500"
            />
          </div>
          <div>
            <label class="block text-xs text-gray-600 mb-1">Demo</label>
            <input
              type="url"
              formControlName="demo"
              placeholder="https://..."
              class="w-full px-3 py-2 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-blue-500"
            />
          </div>
        </div>
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700 mb-2">Highlights</label>
        <div formArrayName="highlights" class="space-y-2">
          <div
            *ngFor="let highlight of getHighlights($any(project)).controls; let j = index"
            class="flex gap-2"
          >
            <input
              type="text"
              [formControl]="$any(highlight)"
              placeholder="Enter highlight..."
              class="flex-1 px-3 py-2 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-blue-500"
            />
            <button
              type="button"
              (click)="removeHighlight($any(project), j)"
              class="px-3 py-2 bg-gray-100 hover:bg-gray-200 rounded text-sm"
            >
              Remove
            </button>
          </div>
          <button
            type="button"
            (click)="addHighlight($any(project))"
            class="px-3 py-1.5 bg-gray-100 hover:bg-gray-200 rounded text-sm"
          >
            + Add Highlight
          </button>
        </div>
      </div>
    </div>
  </div>
</div>
